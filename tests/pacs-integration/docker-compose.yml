version: "3.8"

# Docker Compose orchestration for PACS integration tests.
#
# Usage:
#   docker-compose up -d
#   cargo test -p pacs-integration
#   docker-compose down
#
# Services:
#   - Orthanc:    DIMSE reference PACS (port 4242 DICOM, 8042 HTTP)
#   - dcm4chee:   DICOMweb reference server (port 8080 HTTP, 11112 DICOM)
#   - hapi-fhir:  FHIR R4 server (port 8080 HTTP)

services:
  orthanc:
    image: jodogne/orthanc:latest
    ports:
      - "4242:4242"
      - "8042:8042"
    environment:
      ORTHANC__NAME: "DiCCY Integration Test - Orthanc"
      VERBOSE_ENABLED: "true"
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  dcm4chee:
    image: dcm4che/dcm4chee-arc-psql:latest
    ports:
      - "8080:8080"
      - "11112:11112"
    environment:
      WILDFLY_CHOWN: "true"
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
    depends_on:
      - dcm4chee-db

  dcm4chee-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
    volumes:
      - dcm4chee-db-data:/var/lib/postgresql/data

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "9090:8080"
    environment:
      HAPI_FHIR_SERVER_ADDRESS: "http://hapi-fhir:8080/fhir/"
    volumes:
      - hapi-fhir-data:/data

volumes:
  orthanc-data:
  dcm4chee-db-data:
  hapi-fhir-data:
