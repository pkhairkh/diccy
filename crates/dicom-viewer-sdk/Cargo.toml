[package]
name = "dicom-viewer-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "Document", "Window"] }
serde = { workspace = true }
serde_json = { workspace = true }
viewer-core = { path = "../viewer-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
